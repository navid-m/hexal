name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: windows-aarch64

    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --manifest-path Hexal/Cargo.toml --target ${{ matrix.target }}

      - name: Package release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="package-${ASSET}"
          archive="hexal-${GITHUB_REF_NAME}-${ASSET}.zip"

          rm -rf "$staging" "$archive"
          mkdir -p "$staging"
          cp "Hexal/target/${TARGET}/release/hexal" "$staging/hexal"
          cp -R "Hexal/data" "$staging/data"

          (
            cd "$staging"
            zip -qr "../${archive}" hexal data -x '*.DS_Store'
          )

          echo "Created ${archive}"
          unzip -l "$archive"

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = "package-$env:ASSET"
          $archive = "hexal-$env:GITHUB_REF_NAME-$env:ASSET.zip"

          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null

          Copy-Item "Hexal/target/$env:TARGET/release/hexal.exe" "$staging/hexal.exe"
          Copy-Item -Recurse "Hexal/data" "$staging/data"

          Compress-Archive -Path "$staging/*" -DestinationPath $archive

          Write-Host "Created $archive"
          Get-ChildItem $archive | Format-List Name, Length

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: hexal-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hexal ${{ github.ref_name }}
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
