[package]
name = "hexalrs"
version = "0.1.0"
edition = "2024"
description = "A small Rust prototype of the Hexal terminal editor"

[dependencies]
libc = "0.2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
